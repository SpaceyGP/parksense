<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Park Sense — Smart Parking</title>
<link rel="icon" href="/parksense-logo.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --blue:#0b63ad;--blue-deep:#084e8b;--teal:#11ad9b;--green:#2bb878;--red:#e45a66;--amber:#f1b74f;
  --ink:#153b62;--muted:#64809b;--line:#dce8f2;--bg:#f5f8fc;--card:#fff;--white:#fff;
  --lav:#e9efff;--mint:#e2f7f0;--peach:#fff0e3;--sky:#e7f2ff;--yellow:#fff6da;
  --shadow:0 8px 24px rgba(20,62,95,.09);--radius:16px
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
body.dark{--bg:#101b27;--card:#172536;--white:#172536;--ink:#edf6ff;--muted:#9db3c8;--line:#2b4055;--lav:#263a5a;--mint:#173d38;--peach:#4a3025;--sky:#193955;--yellow:#4b4022}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}.app{min-height:100vh}.topbar{height:74px;background:linear-gradient(110deg,var(--blue-deep),var(--blue) 55%,#147bc1);color:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:1000;box-shadow:0 3px 12px rgba(8,58,103,.16)}
.brand{display:flex;align-items:center;gap:10px;min-width:240px}.brand img{width:56px;height:34px;object-fit:contain}.brand-name{font-size:22px;font-weight:700;letter-spacing:-.4px}.brand-name span{font-weight:400}
.search-wrap{flex:1;max-width:790px;position:relative}.search-wrap input{width:100%;height:46px;border:0;border-radius:12px;padding:0 46px;font-size:16px;outline:none;background:#fff;color:#173b5f;box-shadow:0 3px 10px rgba(0,0,0,.06)}.search-icon{position:absolute;left:16px;top:13px;color:#397197;font-size:18px}.search-results{position:absolute;left:0;right:0;top:52px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none;color:var(--ink)}.search-results.open{display:block}.result-group{padding:9px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:var(--bg)}.result{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:var(--sky)}.result b{display:block}.result small{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;margin-left:auto}.icon-btn,.account-btn{height:42px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:10px}.icon-btn{width:42px;font-size:18px}.account-btn{padding:0 13px;display:flex;align-items:center;gap:9px}.avatar{width:27px;height:27px;background:#fff;color:var(--blue);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}.account-menu{position:absolute;right:24px;top:65px;width:250px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none;color:var(--ink)}.account-menu.open{display:block}.menu-head{padding:11px 12px;border-bottom:1px solid var(--line);margin-bottom:5px}.menu-head b{display:block}.menu-head small{color:var(--muted)}.menu-item{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;color:var(--ink)}.menu-item:hover{background:var(--sky)}.menu-item.danger{color:#c83f4a}
.layout{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 74px)}.side{background:var(--card);border-right:1px solid var(--line);padding:24px 28px;overflow:auto}.map-wrap{position:relative;min-width:0}.map{width:100%;height:100%}h1{font-size:28px;line-height:1.1;margin:0 0 5px}.sub{color:var(--muted);line-height:1.45}.stats{margin:20px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.stat{display:flex;align-items:center;gap:8px;padding:17px 15px;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.stat strong{font-size:27px}.stat span{font-size:13px;color:var(--muted)}.stat .right{margin-left:auto}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}.quick{border:0;border-radius:13px;padding:14px;text-align:left;min-height:68px;color:var(--ink)}.quick b{display:block;font-size:14px}.quick small{display:block;margin-top:4px;color:var(--muted)}.lav{background:var(--lav)}.mint{background:var(--mint)}.peach{background:var(--peach)}.sky{background:var(--sky)}.yellow{background:var(--yellow)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:17px 0 10px}.section-head h3{margin:0;font-size:17px}.link{border:0;background:transparent;color:#0870c5;font-weight:600}.parking-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;box-shadow:0 4px 12px rgba(20,62,95,.045)}.parking-head{display:flex;justify-content:space-between;gap:10px}.parking-head h3{margin:0;font-size:16px}.free{color:var(--green);font-weight:700;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin:6px 0 11px}.card-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 13px;font-size:13px}.btn:hover{filter:brightness(.98)}.btn.primary{background:#0c72bf;border-color:#0c72bf;color:#fff}.btn.green{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:#fff0f1;border-color:#f1c1c5;color:#c43d48}.notice{padding:12px 14px;border-radius:12px;background:var(--yellow);color:#7d5c18;font-size:12px;line-height:1.45;margin:12px 0}.map-chipbar{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:500}.map-chip{background:rgba(255,255,255,.95);border:1px solid #dce8f1;border-radius:18px;padding:8px 12px;font-size:12px;box-shadow:0 4px 12px rgba(20,62,95,.08)}.map-fab{position:absolute;right:16px;bottom:18px;z-index:500;border:0;background:var(--teal);color:#fff;border-radius:10px;padding:11px 14px;box-shadow:0 5px 15px rgba(0,0,0,.15)}.legend{position:absolute;left:16px;bottom:18px;z-index:500;background:rgba(255,255,255,.95);border:1px solid #dce8f1;border-radius:10px;padding:8px 10px;display:flex;gap:12px;font-size:11px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.legend .g{background:var(--green)}.legend .r{background:var(--red)}.legend .a{background:var(--amber)}
.screen{padding:28px 30px;min-height:calc(100vh - 74px);overflow:auto}.screen-title{display:flex;align-items:flex-end;gap:20px;margin-bottom:14px}.screen-title h1{font-size:31px}.eyebrow{font-size:12px;letter-spacing:1.3px;color:#0870c5;font-weight:800;margin-bottom:5px}.screen-actions{display:flex;gap:8px;margin-left:auto}.tabs{display:flex;gap:6px;margin-bottom:17px;border-bottom:1px solid var(--line);padding-bottom:8px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px;font-weight:600}.tab.active,.tab:hover{background:var(--sky);color:#0b63ad}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.kpi .label{font-size:12px;color:var(--muted)}.kpi .num{font-size:30px;font-weight:700;margin:4px 0}.kpi .hint{font-size:12px;color:var(--teal)}.dashboard-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-top:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.panel h2{font-size:18px;margin:0 0 4px}.panel>p{font-size:12px;color:var(--muted);margin:0 0 15px}.bar-chart{height:150px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line);padding:0 4px}.bar{flex:1;max-width:28px;background:linear-gradient(180deg,#2f99d3,#0b72bf);border-radius:7px 7px 0 0}.op-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.op-row:last-child{border-bottom:0}.pill{display:inline-flex;align-items:center;gap:5px;background:var(--mint);color:#087c69;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700}.pill.warn{background:var(--peach);color:#a66a14}.manage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.facility{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--bg)}.facility h3{margin:0 0 8px;font-size:15px}.line{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:5px 0}.small{font-size:11px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(13,44,72,.42);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(900px,96vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.25);color:var(--ink)}.modal.small-modal{width:min(520px,94vw)}.modal-head{display:flex;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}.modal-head h2{margin:0;font-size:23px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.close{width:36px;height:36px;border:0;background:var(--sky);color:var(--ink);border-radius:50%;font-size:20px}.modal-body{padding:20px 22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:17px}.summary-box{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg)}.summary-box .big{font-size:24px;font-weight:700}.summary-box p{margin:4px 0 0;color:var(--muted);font-size:11px}.level-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.level-tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:9px}.level-tab.active{background:#0b72bf;color:#fff;border-color:#0b72bf}.floor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.area-block{margin:12px 0}.area-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.space-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.space{min-height:80px;border:1px solid var(--line);border-radius:11px;padding:9px;text-align:left}.space.free{background:var(--mint);color:#087c69}.space.occupied{background:#ffe9eb;color:#b63d49}.space.reserved{background:#fff0c9;color:#8b6518}.space b{display:block;font-size:15px}.space small{display:block;margin-top:3px;font-size:11px}.space button{margin-top:7px;border:0;background:var(--teal);color:#fff;border-radius:7px;padding:5px 8px;font-size:11px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--card);color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#67a9d6}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.editor-card{border:1px solid var(--line);border-radius:13px;margin-top:10px;overflow:hidden}.editor-top{padding:12px 13px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px}.editor-body{padding:12px}.editor-row{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.editor-row-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.inline{display:flex;gap:6px;flex-wrap:wrap}.mini-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:5px 8px;font-size:11px}.mini-btn.danger{color:#c43d48}.stat-table{width:100%;border-collapse:collapse;font-size:12px}.stat-table th,.stat-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.stat-table th{color:var(--muted);font-weight:600}
.auth{min-height:100vh;background:linear-gradient(135deg,#e7f2ff 0%,#f6fbff 48%,#e6f8f2 100%);display:grid;place-items:center;padding:24px}.auth-card{width:min(900px,95vw);display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(20,62,95,.16);border:1px solid #dbe9f4}.auth-art{padding:40px;background:linear-gradient(145deg,#075fa8,#0d75bc 60%,#11ad9b);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.auth-art img{width:150px;height:auto;object-fit:contain;object-position:left}.auth-art h1{font-size:38px;max-width:330px;margin-top:35px}.auth-art p{opacity:.9;line-height:1.5;max-width:350px}.auth-badges{display:flex;gap:7px;flex-wrap:wrap}.auth-badge{padding:7px 9px;border-radius:20px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);font-size:11px}.auth-form{padding:40px}.auth-form h2{margin:0 0 6px;font-size:28px}.auth-form>p{color:var(--muted);font-size:13px}.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.role-switch button{padding:10px;border:1px solid var(--line);background:var(--bg);border-radius:9px;color:var(--ink)}.role-switch button.active{background:var(--sky);border-color:#7ab3dc;color:#0b63ad;font-weight:700}.auth-actions{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.demo-login{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.demo-login button{border:0;background:transparent;color:#0870c5;font-size:12px;margin-right:12px;padding:0}.auth-error{min-height:18px;color:#c43d48;font-size:12px;margin-top:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#153b62;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:5000;font-size:13px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
body.dark .leaflet-tile{filter:brightness(.72) saturate(.8)}
@media(max-width:1050px){.layout{grid-template-columns:360px}.brand{min-width:190px}.brand-name{font-size:19px}.kpis{grid-template-columns:1fr 1fr}.manage-grid{grid-template-columns:1fr 1fr}.dashboard-grid{grid-template-columns:1fr}}
@media(max-width:800px){.topbar{height:auto;min-height:74px;flex-wrap:wrap;padding:12px}.brand{min-width:auto}.search-wrap{order:3;flex-basis:100%;max-width:none}.layout{display:block;height:auto}.side{max-height:none}.map-wrap{height:58vh}.screen{padding:20px 15px}.screen-title{align-items:flex-start;flex-direction:column}.screen-actions{margin-left:0}.manage-grid{grid-template-columns:1fr}.auth-card{grid-template-columns:1fr}.auth-art{display:none}.summary{grid-template-columns:1fr 1fr}.space-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.account-menu{right:10px}}
</style>

<body>
<div id="app"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const state={user:null,data:null,map:null,markers:new Map(),selected:null,screen:'driver',level:0,menu:false};
const destinations=[
 {name:'DLF Promenade',detail:'Vasant Kunj, New Delhi',lat:28.5439,lng:77.1553},
 {name:'Select CITYWALK',detail:'Saket, New Delhi',lat:28.5286,lng:77.2197},
 {name:'DLF CyberHub',detail:'DLF Cyber City, Gurugram',lat:28.4955,lng:77.0898},
 {name:'Connaught Place',detail:'Central Delhi',lat:28.6315,lng:77.2167},
 {name:'India Gate',detail:'New Delhi',lat:28.6129,lng:77.2295}
];
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
function icon(name){const icons={home:'⌂',pin:'⌖',bell:'◉',sun:'☼',user:'●',search:'⌕',car:'▰',chart:'▥',settings:'⚙',plus:'＋',trash:'⌫',edit:'✎',back:'‹',reserve:'◆'};return icons[name]||'•'}
function openModal(html,small=false){$('modal').className='modal'+(small?' small-modal':'');$('modal').innerHTML=html;$('modalBackdrop').classList.add('open')}
function closeModal(){$('modalBackdrop').classList.remove('open');$('modal').innerHTML=''}
$('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function applyTheme(){document.body.classList.toggle('dark',!!state.data?.settings?.darkMode)}
async function load(){try{const me=await api('/api/me');if(!me.user){renderAuth();return}state.user=me.user;state.screen=state.user.role==='operator'?'operator':'driver';state.data=await api('/api/state');applyTheme();render();}catch(e){renderAuth(e.message)}}
function renderAuth(error=''){document.body.classList.remove('dark');$('app').innerHTML=`<div class="auth"><div class="auth-card"><section class="auth-art"><div><img src="/parksense-logo.png" alt="Park Sense"><h1>Parking that feels simple.</h1><p>Find connected parking, see space availability by floor and bay, reserve a space and manage facilities from one place.</p></div><div class="auth-badges"><span class="auth-badge">Live parking map</span><span class="auth-badge">Reservations</span><span class="auth-badge">Operator analytics</span></div></section><section class="auth-form"><h2 id="authTitle">Welcome back</h2><p id="authSub">Sign in to continue to Park Sense.</p><div class="role-switch"><button id="driverRole" class="active" onclick="setAuthRole('driver')">Driver</button><button id="operatorRole" onclick="setAuthRole('operator')">Operator</button></div><div id="signupFields" class="hidden"><div class="field"><label>Full name</label><input id="authName" placeholder="Your name"></div></div><div class="field" style="margin-top:10px"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="authPassword" type="password" placeholder="At least 6 characters"></div><div id="authError" class="auth-error">${esc(error)}</div><div class="auth-actions"><button class="btn primary" id="authSubmit" onclick="submitAuth()">Sign in</button><button class="link" id="authToggle" onclick="toggleAuthMode()">Create account</button></div><div class="demo-login"><small class="small">Demo accounts</small><br><button onclick="demoLogin('driver')">Driver demo</button><button onclick="demoLogin('operator')">Operator demo</button></div></section></div></div>`;window.authMode='login';window.authRole='driver'}
function setAuthRole(role){window.authRole=role;document.querySelectorAll('.role-switch button').forEach(b=>b.classList.remove('active'));$(role+'Role').classList.add('active')}
function toggleAuthMode(){window.authMode=window.authMode==='login'?'signup':'login';$('authTitle').textContent=window.authMode==='login'?'Welcome back':'Create your Park Sense account';$('authSub').textContent=window.authMode==='login'?'Sign in to continue to Park Sense.':'Choose how you will use Park Sense.';$('signupFields').classList.toggle('hidden',window.authMode!=='signup');$('authSubmit').textContent=window.authMode==='login'?'Sign in':'Create account';$('authToggle').textContent=window.authMode==='login'?'Create account':'I already have an account'}
async function demoLogin(role){$('authEmail').value=role==='driver'?'driver@parksense.local':'operator@parksense.local';$('authPassword').value=role==='driver'?'driver123':'operator123';window.authRole=role;await submitAuth()}
async function submitAuth(){try{$('authError').textContent='';const body={email:$('authEmail').value,password:$('authPassword').value,role:window.authRole};if(window.authMode==='signup'){body.name=$('authName').value}const r=await api('/api/auth/'+(window.authMode==='login'?'login':'signup'),{method:'POST',body:JSON.stringify(body)});state.user=r.user;state.data=await api('/api/state');state.screen=state.user.role==='operator'?'operator':'driver';applyTheme();render()}catch(e){$('authError').textContent=e.message}}
function header(){const initials=(state.user.name||'P').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<header class="topbar"><div class="brand"><img src="/parksense-logo.png" alt="Park Sense"><div class="brand-name">park <span>sense</span></div></div><div class="search-wrap"><span class="search-icon">${icon('search')}</span><input id="searchInput" placeholder="Search parking or destination" autocomplete="off"><div class="search-results" id="searchResults"></div></div><div class="actions"><button class="icon-btn" title="Home" onclick="goHome()">${icon('home')}</button><button class="icon-btn" title="Notifications" onclick="showNotifications()">${icon('bell')}</button><button class="icon-btn" title="Appearance" onclick="toggleDark()">${icon('sun')}</button><button class="account-btn" onclick="toggleAccountMenu()"><span class="avatar">${initials}</span>${esc(state.user.role==='operator'?'Operator':'Driver')}</button></div><div class="account-menu" id="accountMenu"><div class="menu-head"><b>${esc(state.user.name)}</b><small>${esc(state.user.email)}</small></div><button class="menu-item" onclick="profile()">Account & profile</button><button class="menu-item" onclick="settings()">Settings</button><button class="menu-item" onclick="switchAccount()">Switch account</button><button class="menu-item danger" onclick="logout()">Sign out</button></div></header>`}
function render(){if(!state.user||!state.data){renderAuth();return}if(state.screen!=='driver'&&state.map){state.map.remove();state.map=null;state.markers.clear()}$('app').innerHTML=header()+(state.screen==='operator'?operatorView():driverView());bindSearch();if(state.screen==='driver')initMap();}
function bindSearch(){const input=$('searchInput');if(!input)return;input.addEventListener('input',()=>showSearch(input.value.trim()));input.addEventListener('focus',()=>{if(input.value.trim())showSearch(input.value.trim())});document.addEventListener('click',function once(e){if(!e.target.closest('.search-wrap'))$('searchResults')?.classList.remove('open');});}
function showSearch(q){const r=$('searchResults');if(!r)return;const s=q.toLowerCase();const ps=state.data.parking.filter(p=>(p.name+' '+p.address+' '+p.floors.map(f=>f.name+' '+f.areas.map(a=>a.name+' '+a.spaces.map(x=>x.id).join(' ')).join(' ')).join(' ')).toLowerCase().includes(s));const ds=destinations.filter(d=>(d.name+' '+d.detail).toLowerCase().includes(s));r.innerHTML='';if(!q||(!ps.length&&!ds.length)){if(q)r.innerHTML='<div class="result">No matching parking or destination.</div>';r.classList.toggle('open',!!q);return}if(ds.length){r.innerHTML+='<div class="result-group">Destinations</div>';ds.slice(0,4).forEach(d=>r.innerHTML+=`<div class="result" onclick="chooseDestination(${d.lat},${d.lng},'${esc(d.name)}')"><b>${esc(d.name)}</b><small>${esc(d.detail)} · find nearby parking</small></div>`)}if(ps.length){r.innerHTML+='<div class="result-group">Connected parking</div>';ps.slice(0,6).forEach(p=>r.innerHTML+=`<div class="result" onclick="focusParking('${p.id}')"><b>${esc(p.name)}</b><small>${esc(p.address)} · ${p.stats.free} free of ${p.stats.total}</small></div>`)}r.classList.add('open')}
function chooseDestination(lat,lng,name){$('searchResults')?.classList.remove('open');state.map?.flyTo([lat,lng],15,{animate:true});toast(`${name} selected. Showing connected parking nearby.`);}
function initMap(){setTimeout(()=>{if(state.map){state.map.invalidateSize();return}state.map=L.map('map',{zoomControl:true,attributionControl:true}).setView([28.5439,77.1553],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(state.map);refreshMarkers();},0)}
function refreshMarkers(){if(!state.map)return;state.markers.forEach(m=>state.map.removeLayer(m));state.markers.clear();state.data.parking.forEach(p=>{const color=p.stats.free>0?'#11ad9b':'#e45a66';const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)"><div style="transform:rotate(45deg);color:#fff;text-align:center;font-weight:700;line-height:28px">P</div></div>`,iconSize:[34,34],iconAnchor:[17,34]})}).addTo(state.map).bindPopup(`<b>${esc(p.name)}</b><br><span style="color:#64809b">${p.stats.free} free · ${p.stats.occupied} occupied</span>`).on('click',()=>showSpaces(p.id));state.markers.set(p.id,m)})}
function focusParking(id){$('searchResults')?.classList.remove('open');const p=state.data.parking.find(x=>x.id===id);if(!p)return;state.map?.flyTo([p.lat,p.lng],16,{animate:true});showSpaces(id)}
function goHome(){state.screen=state.user.role==='operator'?'operator':'driver';state.selected=null;render()}
function driverView(){const ps=state.data.parking;const total=ps.reduce((a,p)=>a+p.stats.total,0),free=ps.reduce((a,p)=>a+p.stats.free,0);return headerlessPage(`
<div class="layout"><aside class="side"><h1>Parking around you</h1><div class="sub">Connected parking with clear space information.</div><div class="stats"><div class="stat"><strong>${ps.length}</strong><span>connected sites</span><span class="right">in your area</span></div><div class="stat"><strong>${free}</strong><span>spaces free</span><span class="right">right now</span></div><div class="stat"><strong>Just now</strong><span>last update</span><span class="right">connected data</span></div></div><div class="quick-grid"><button class="quick lav" onclick="findParking()"><b>Near me</b><small>Find connected parking</small></button><button class="quick mint" onclick="bestAvailability()"><b>Most spaces</b><small>Show best availability</small></button><button class="quick peach" onclick="myReservations()"><b>My reservations</b><small>View reserved bays</small></button><button class="quick sky" onclick="showNotifications()"><b>Updates</b><small>Parking notifications</small></button></div><div class="notice">Green spaces are available, red spaces are occupied and amber spaces are reserved. Select a parking site to see its floors, areas and bay labels.</div><div class="section-head"><h3>Nearby parking</h3><button class="link" onclick="load()">Refresh</button></div>${ps.map(p=>parkingCard(p)).join('')}</aside><main class="map-wrap"><div id="map" class="map"></div><div class="map-chipbar"><span class="map-chip">● Connected parking</span><span class="map-chip">● ${total} spaces mapped</span></div><button class="map-fab" onclick="findParking()">${icon('pin')} Find parking here</button><div class="legend"><span><i class="g"></i>Available</span><span><i class="r"></i>Occupied</span><span><i class="a"></i>Reserved</span></div></main></div>`)}
function headerlessPage(content){return content}
function parkingCard(p){return `<div class="parking-card"><div class="parking-head"><h3>${esc(p.name)}</h3><span class="free">${p.stats.free} free</span></div><div class="meta">${esc(p.address)} · ${p.floors.length} ${p.floors.length===1?'level':'levels'} · ₹${p.rate}/hour</div><div class="card-actions"><button class="btn primary" onclick="showSpaces('${p.id}')">View spaces</button><button class="btn" onclick="focusMap('${p.id}')">Map</button></div></div>`}
function focusMap(id){const p=state.data.parking.find(x=>x.id===id);if(p){state.map?.flyTo([p.lat,p.lng],16,{animate:true});toast(`${p.name} centered on the map.`)}}
function findParking(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{state.map?.flyTo([pos.coords.latitude,pos.coords.longitude],15,{animate:true});toast('Map centered on your current location.');},()=>{state.map?.setView([28.5439,77.1553],14,{animate:true});toast('Location access is unavailable, so the map is centered on Park Sense demo parking.');})}else{state.map?.setView([28.5439,77.1553],14);}}
function bestAvailability(){const p=[...state.data.parking].sort((a,b)=>b.stats.free-a.stats.free)[0];if(p){focusMap(p.id);showSpaces(p.id)}}
function showSpaces(id){const p=state.data.parking.find(x=>x.id===id);if(!p)return;state.selected=p;state.level=0;openSpaces(p)}
async function openSpaces(p){const full=await api('/api/parking/'+p.id);const levels=full.floors||[];const f=levels[state.level]||levels[0];const spaces=f?(f.areas||[]).flatMap(a=>a.spaces.map(s=>({...s,areaName:a.name}))):[];openModal(`<div class="modal-head"><div><h2>${esc(full.name)}</h2><p>${esc(full.address)} · ₹${full.rate}/hour</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="summary"><div class="summary-box"><div class="big">${full.stats.free}</div><p>spaces available</p></div><div class="summary-box"><div class="big">${full.stats.occupied}</div><p>occupied</p></div><div class="summary-box"><div class="big">${full.stats.reserved}</div><p>reserved</p></div><div class="summary-box"><div class="big">${full.stats.total}</div><p>total spaces</p></div></div><div class="level-tabs">${levels.map((l,i)=>`<button class="level-tab ${i===state.level?'active':''}" onclick="state.level=${i};openSpaces(state.selected)">${esc(l.name)}</button>`).join('')}</div><div class="floor-head"><b>${esc(f?.name||'Floor')}</b><span class="small">Select a bay to reserve it</span></div>${(f?.areas||[]).map(a=>`<div class="area-block"><div class="area-title"><b>${esc(a.name)}</b><span class="small">${a.spaces.length} spaces</span></div><div class="space-grid">${a.spaces.map(s=>`<div class="space ${s.status}"><b>${esc(s.id)}</b><small>${esc(s.type||'standard')} · ${s.status}</small>${s.status==='free'?`<button onclick="reserveSpace('${full.id}','${esc(s.id)}')">Reserve</button>`:''}</div>`).join('')}</div></div>`).join('')}</div><div class="modal-footer"><button class="btn" onclick="focusMap('${full.id}');closeModal()">Show on map</button><button class="btn primary" onclick="closeModal()">Done</button></div>`)}
async function reserveSpace(pid,sid){try{const r=await api('/api/reservations',{method:'POST',body:JSON.stringify({parkingId:pid,spaceId:sid})});toast(`Reserved ${r.spaceId} at ${r.parkingName}.`);state.data=await api('/api/state');const p=state.data.parking.find(x=>x.id===pid);state.selected=p;openSpaces(p);refreshMarkers()}catch(e){toast(e.message)}}
async function myReservations(){const rs=state.data.reservations.filter(r=>r.userId===state.user.id);openModal(`<div class="modal-head"><div><h2>My reservations</h2><p>Reserved parking spaces linked to your account.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${rs.length?rs.map(r=>`<div class="parking-card"><div class="parking-head"><h3>${esc(r.parkingName)}</h3><span class="pill">ACTIVE</span></div><div class="meta">${esc(r.floorName)} · ${esc(r.areaName)} · <b>${esc(r.spaceId)}</b></div><div class="card-actions"><button class="btn danger" onclick="cancelReservation('${r.id}')">Cancel reservation</button><button class="btn" onclick="focusParking('${r.parkingId}');closeModal()">View parking</button></div></div>`).join(''):'<div class="notice">You do not have any active reservations.</div>'}</div>`,false)}
async function cancelReservation(id){try{await api('/api/reservations/'+id,{method:'DELETE'});toast('Reservation cancelled.');state.data=await api('/api/state');myReservations();if(state.user.role==='driver')refreshMarkers()}catch(e){toast(e.message)}}
function operatorView(){const ps=state.data.parking;const t=totals();return `<main class="screen"><div class="screen-title"><div><div class="eyebrow">OPERATIONS CENTRE</div><h1>Parking overview</h1><div class="sub">A clear view of your facilities, occupancy and layout.</div></div><div class="screen-actions"><button class="btn" onclick="go('driver')">Driver view</button><button class="btn green" onclick="addParking()">＋ Add parking</button></div></div><div class="tabs"><button class="tab active">Overview</button><button class="tab" onclick="manageFacilities()">Facilities & layout</button><button class="tab" onclick="analytics()">Statistics</button></div><div class="kpis"><div class="kpi"><div class="label">Parking areas</div><div class="num">${ps.length}</div><div class="hint">Connected facilities</div></div><div class="kpi"><div class="label">Total spaces</div><div class="num">${t.total}</div><div class="hint">Across ${t.levels} levels</div></div><div class="kpi"><div class="label">Available now</div><div class="num">${t.free}</div><div class="hint">${t.total?Math.round(t.free/t.total*100):0}% capacity</div></div><div class="kpi"><div class="label">Occupancy</div><div class="num">${t.occPct}%</div><div class="hint">Based on stored parking data</div></div></div><div class="dashboard-grid"><div class="panel"><h2>Occupancy by facility</h2><p>Current occupancy from the parking data stored in Park Sense.</p><div>${ps.map(p=>`<div class="op-row"><span><b>${esc(p.name)}</b><br><small class="small">${p.stats.occupied} occupied · ${p.stats.free} free · ${p.stats.reserved} reserved</small></span><span class="pill ${p.stats.occupancy>80?'warn':''}">${p.stats.occupancy}%</span></div>`).join('')}</div></div><div class="panel"><h2>System summary</h2><p>Useful operational figures without simulated sensor events.</p><div class="op-row"><span>Available bays</span><b>${t.free}</b></div><div class="op-row"><span>Occupied bays</span><b>${t.occ}</b></div><div class="op-row"><span>Reserved bays</span><b>${t.res}</b></div><div class="op-row"><span>Floors configured</span><b>${t.levels}</b></div><div class="op-row"><span>Areas configured</span><b>${t.areas}</b></div><div class="op-row"><span>Active reservations</span><b>${state.data.reservations.length}</b></div></div></div><div class="panel" style="margin-top:12px"><div class="section-head"><div><h2>Your facilities</h2><p style="margin:4px 0 0">Manage names, levels, areas, bay labels and stored occupancy states.</p></div><button class="link" onclick="manageFacilities()">Manage all</button></div><div class="manage-grid">${ps.map(p=>`<div class="facility"><h3>${esc(p.name)}</h3><div class="line"><span>${esc(p.address)}</span><b class="free">${p.stats.free} free</b></div><div class="line"><span>${p.floors.length} levels · ${countAreas(p)} areas</span><span>${p.stats.total} bays</span></div><div class="line"><span>Occupied</span><span>${p.stats.occupancy}%</span></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="manageFacility('${p.id}')">Manage</button><button class="btn" onclick="focusMapFromOperator('${p.id}')">Map</button></div></div>`).join('')}</div></div></main>`}
function totals(){const ps=state.data.parking;const t={total:0,free:0,occ:0,res:0,levels:0,areas:0};ps.forEach(p=>{t.total+=p.stats.total;t.free+=p.stats.free;t.occ+=p.stats.occupied;t.res+=p.stats.reserved;t.levels+=p.floors.length;t.areas+=countAreas(p)});t.occPct=t.total?Math.round(t.occ/t.total*100):0;return t}
function countAreas(p){return p.floors.reduce((n,f)=>n+f.areas.length,0)}
function manageFacilities(){openModal(`<div class="modal-head"><div><h2>Facilities & layout</h2><p>Keep the management surface simple: choose one parking, then edit only what you need.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${state.data.parking.map(p=>`<div class="parking-card"><div class="parking-head"><h3>${esc(p.name)}</h3><span class="free">${p.stats.free} free</span></div><div class="meta">${esc(p.address)} · ${p.floors.length} levels · ${p.stats.total} bays</div><div class="card-actions"><button class="btn primary" onclick="closeModal();manageFacility('${p.id}')">Edit layout</button><button class="btn danger" onclick="deleteFacility('${p.id}')">Delete</button></div></div>`).join('')}<button class="btn green" onclick="closeModal();addParking()">＋ Add another parking area</button></div>`,false)}
function manageFacility(id){const p=state.data.parking.find(x=>x.id===id);if(!p)return;openModal(`<div class="modal-head"><div><h2>Edit ${esc(p.name)}</h2><p>Facility details and layout</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Parking name</label><input id="m-name" value="${esc(p.name)}"></div><div class="field"><label>Hourly rate (₹)</label><input id="m-rate" type="number" value="${p.rate}"></div><div class="field full"><label>Address</label><input id="m-address" value="${esc(p.address)}"></div><div class="field"><label>Latitude</label><input id="m-lat" type="number" step="0.000001" value="${p.lat}"></div><div class="field"><label>Longitude</label><input id="m-lng" type="number" step="0.000001" value="${p.lng}"></div><div class="field"><label>Status</label><select id="m-status"><option value="open" ${p.status==='open'?'selected':''}>Open</option><option value="closed" ${p.status==='closed'?'selected':''}>Closed</option></select></div></div><div class="modal-footer"><button class="btn danger" onclick="deleteFacility('${p.id}')">Delete parking</button><button class="btn primary" onclick="saveFacility('${p.id}')">Save details</button></div><div class="section-head"><div><h3>Floors, areas & bays</h3><div class="small">Use real labels such as Level 1, Area B, Pillar B-11 or Bay B-11.</div></div><button class="btn green" onclick="addFloor('${p.id}')">＋ Add level</button></div>${p.floors.map(f=>floorEditor(p,f)).join('')}</div>`,false)}
function floorEditor(p,f){return `<div class="editor-card"><div class="editor-top"><div><b>${esc(f.name)}</b><div class="small">${countFloorSpaces(f)} spaces · ${f.areas.length} areas</div></div><div class="inline"><button class="mini-btn" onclick="renameFloor('${p.id}','${f.id}','${esc(f.name)}')">Edit</button><button class="mini-btn danger" onclick="deleteFloor('${p.id}','${f.id}')">Delete</button><button class="mini-btn" onclick="addArea('${p.id}','${f.id}')">＋ Area</button></div></div><div class="editor-body">${f.areas.map(a=>areaEditor(p,f,a)).join('')||'<span class="small">No areas yet.</span>'}</div></div>`}
function countFloorSpaces(f){return f.areas.reduce((n,a)=>n+a.spaces.length,0)}
function areaEditor(p,f,a){return `<div class="editor-row"><div class="editor-row-head"><div><b>${esc(a.name)}</b><div class="small">Area code: ${esc(a.id)} · ${a.spaces.length} bays</div></div><div class="inline"><button class="mini-btn" onclick="renameArea('${p.id}','${a.id}','${esc(a.name)}')">Edit</button><button class="mini-btn danger" onclick="deleteArea('${p.id}','${a.id}')">Delete</button><button class="mini-btn" onclick="addSpace('${p.id}','${f.id}','${a.id}')">＋ Bay</button></div></div><div class="inline" style="margin-top:10px">${a.spaces.map(s=>`<span class="pill ${s.status==='occupied'?'warn':''}" title="${esc(s.id)} · ${esc(s.type||'standard')} · ${s.status}">${esc(s.id)} · ${esc(s.status)}</span><button class="mini-btn" onclick="editSpace('${p.id}','${esc(s.id)}','${esc(s.type||'standard')}','${s.status}')">Edit</button>`).join('')||'<span class="small">No bays yet.</span>'}</div></div>`}
async function saveFacility(id){try{await api('/api/parking/'+id,{method:'PUT',body:JSON.stringify({name:$('m-name').value,address:$('m-address').value,rate:Number($('m-rate').value),lat:Number($('m-lat').value),lng:Number($('m-lng').value),status:$('m-status').value})});toast('Facility details saved.');state.data=await api('/api/state');closeModal();render()}catch(e){toast(e.message)}}
async function deleteFacility(id){if(!confirm('Delete this parking facility and its reservations? This cannot be undone.'))return;try{await api('/api/parking/'+id,{method:'DELETE'});toast('Parking facility deleted.');state.data=await api('/api/state');closeModal();render()}catch(e){toast(e.message)}}
function addParking(){openModal(`<div class="modal-head"><div><h2>Add parking area</h2><p>Connect a new facility to your operator account.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field full"><label>Parking name</label><input id="a-name" placeholder="e.g. DLF Promenade Parking"></div><div class="field full"><label>Address</label><input id="a-address" placeholder="Vasant Kunj, New Delhi"></div><div class="field"><label>Hourly rate (₹)</label><input id="a-rate" type="number" value="30"></div><div class="field"><label>Status</label><select id="a-status"><option value="open">Open</option><option value="closed">Closed</option></select></div><div class="field"><label>Latitude</label><input id="a-lat" type="number" step="0.000001" value="28.543900"></div><div class="field"><label>Longitude</label><input id="a-lng" type="number" step="0.000001" value="77.155300"></div></div><div class="notice">Coordinates place the marker on the selected parking facility, not on a runway or a random map point.</div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="createParking()">Create parking</button></div></div>`,true)}
async function createParking(){try{const p=await api('/api/parking',{method:'POST',body:JSON.stringify({name:$('a-name').value,address:$('a-address').value,rate:Number($('a-rate').value),status:$('a-status').value,lat:Number($('a-lat').value),lng:Number($('a-lng').value)})});toast(`${p.name} added.`);state.data=await api('/api/state');closeModal();render()}catch(e){toast(e.message)}}
function addFloor(pid){openModal(`<div class="modal-head"><div><h2>Add level</h2><p>Examples: Ground Floor, Level 1, P2, Basement B1.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Level name</label><input id="f-name" placeholder="Level 2"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="createFloor('${pid}')">Add level</button></div></div>`,true)}
async function createFloor(pid){try{await api('/api/parking/'+pid+'/floors',{method:'POST',body:JSON.stringify({name:$('f-name').value})});toast('Level added.');state.data=await api('/api/state');closeModal();manageFacility(pid)}catch(e){toast(e.message)}}
function renameFloor(pid,fid,current){openModal(`<div class="modal-head"><h2>Rename level</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Level name</label><input id="rename-floor" value="${esc(current)}"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFloorName('${pid}','${fid}')">Save</button></div></div>`,true)}
async function saveFloorName(pid,fid){try{await api('/api/parking/'+pid+'/floor/'+fid,{method:'PUT',body:JSON.stringify({name:$('rename-floor').value})});state.data=await api('/api/state');closeModal();manageFacility(pid);toast('Level updated.')}catch(e){toast(e.message)}}
async function deleteFloor(pid,fid){if(!confirm('Delete this level and all its bays?'))return;try{await api('/api/parking/'+pid+'/floor/'+fid,{method:'DELETE'});state.data=await api('/api/state');manageFacility(pid);toast('Level deleted.')}catch(e){toast(e.message)}}
function addArea(pid,fid){openModal(`<div class="modal-head"><h2>Add area</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Area code</label><input id="area-id" placeholder="B"></div><div class="field"><label>Area name</label><input id="area-name" placeholder="Area B"></div></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="createArea('${pid}','${fid}')">Add area</button></div></div>`,true)}
async function createArea(pid,fid){try{await api('/api/parking/'+pid+'/areas',{method:'POST',body:JSON.stringify({floorId:fid,id:$('area-id').value,name:$('area-name').value})});state.data=await api('/api/state');closeModal();manageFacility(pid);toast('Area added.')}catch(e){toast(e.message)}}
function renameArea(pid,aid,current){openModal(`<div class="modal-head"><h2>Rename area</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Area name</label><input id="rename-area" value="${esc(current)}"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAreaName('${pid}','${aid}')">Save</button></div></div>`,true)}
async function saveAreaName(pid,aid){try{await api('/api/parking/'+pid+'/area/'+aid,{method:'PUT',body:JSON.stringify({name:$('rename-area').value})});state.data=await api('/api/state');closeModal();manageFacility(pid);toast('Area updated.')}catch(e){toast(e.message)}}
async function deleteArea(pid,aid){if(!confirm('Delete this area and all its bays?'))return;try{await api('/api/parking/'+pid+'/area/'+aid,{method:'DELETE'});state.data=await api('/api/state');manageFacility(pid);toast('Area deleted.')}catch(e){toast(e.message)}}
function addSpace(pid,fid,aid){openModal(`<div class="modal-head"><h2>Add parking bay</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Bay label</label><input id="space-id" placeholder="B-11"></div><div class="field"><label>Type</label><select id="space-type"><option value="standard">Standard</option><option value="accessible">Accessible</option><option value="ev">EV</option><option value="compact">Compact</option></select></div></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="createSpace('${pid}','${fid}','${aid}')">Add bay</button></div></div>`,true)}
async function createSpace(pid,fid,aid){try{await api('/api/parking/'+pid+'/spaces',{method:'POST',body:JSON.stringify({floorId:fid,areaId:aid,id:$('space-id').value,type:$('space-type').value})});state.data=await api('/api/state');closeModal();manageFacility(pid);toast('Parking bay added.')}catch(e){toast(e.message)}}
function editSpace(pid,sid,type,status){openModal(`<div class="modal-head"><h2>Edit parking bay</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Bay label</label><input id="edit-space-id" value="${esc(sid)}"></div><div class="field"><label>Type</label><select id="edit-space-type"><option value="standard" ${type==='standard'?'selected':''}>Standard</option><option value="accessible" ${type==='accessible'?'selected':''}>Accessible</option><option value="ev" ${type==='ev'?'selected':''}>EV</option><option value="compact" ${type==='compact'?'selected':''}>Compact</option></select></div><div class="field"><label>Stored occupancy state</label><select id="edit-space-status"><option value="free" ${status==='free'?'selected':''}>Available</option><option value="occupied" ${status==='occupied'?'selected':''}>Occupied</option><option value="reserved" ${status==='reserved'?'selected':''}>Reserved</option></select></div></div><div class="notice">This edits the stored parking data. It does not simulate a sensor.</div><div class="modal-footer"><button class="btn danger" onclick="deleteSpace('${pid}','${esc(sid)}')">Delete bay</button><button class="btn primary" onclick="saveSpace('${pid}','${esc(sid)}')">Save</button></div></div>`,true)}
async function saveSpace(pid,sid){try{await api('/api/parking/'+pid+'/space/'+encodeURIComponent(sid),{method:'PUT',body:JSON.stringify({newId:$('edit-space-id').value,type:$('edit-space-type').value,status:$('edit-space-status').value})});state.data=await api('/api/state');closeModal();manageFacility(pid);toast('Bay updated.')}catch(e){toast(e.message)}}
async function deleteSpace(pid,sid){if(!confirm('Delete this parking bay?'))return;try{await api('/api/parking/'+pid+'/space/'+encodeURIComponent(sid),{method:'DELETE'});state.data=await api('/api/state');closeModal();manageFacility(pid);toast('Bay deleted.')}catch(e){toast(e.message)}}
function analytics(){const t=totals();openModal(`<div class="modal-head"><div><h2>Parking statistics</h2><p>Derived from the stored facility and reservation data.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="summary"><div class="summary-box"><div class="big">${t.total}</div><p>Total bays</p></div><div class="summary-box"><div class="big">${t.free}</div><p>Available</p></div><div class="summary-box"><div class="big">${t.occPct}%</div><p>Occupancy</p></div><div class="summary-box"><div class="big">${t.res}</div><p>Reserved</p></div></div><table class="stat-table"><thead><tr><th>Facility</th><th>Capacity</th><th>Free</th><th>Occupied</th><th>Reserved</th><th>Occupancy</th></tr></thead><tbody>${state.data.parking.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.stats.total}</td><td>${p.stats.free}</td><td>${p.stats.occupied}</td><td>${p.stats.reserved}</td><td>${p.stats.occupancy}%</td></tr>`).join('')}</tbody></table><div class="notice">Park Sense reports the stored parking state as data. No artificial sensor events are generated. A future sensor gateway can update these same bay states through the backend API.</div></div>`)}
function focusMapFromOperator(id){const p=state.data.parking.find(x=>x.id===id);if(!p)return;openModal(`<div class="modal-head"><h2>${esc(p.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><p class="sub">${esc(p.address)}</p><div class="summary"><div class="summary-box"><div class="big">${p.stats.free}</div><p>Available</p></div><div class="summary-box"><div class="big">${p.stats.occupied}</div><p>Occupied</p></div><div class="summary-box"><div class="big">${p.stats.reserved}</div><p>Reserved</p></div><div class="summary-box"><div class="big">${p.stats.occupancy}%</div><p>Occupancy</p></div></div><div class="modal-footer"><button class="btn primary" onclick="closeModal();toast('Map view is available from Driver view.');go('driver')">Open driver map</button></div></div>`,true)}
async function toggleDark(){const next=!state.data.settings.darkMode;state.data.settings=await api('/api/settings',{method:'PUT',body:JSON.stringify({darkMode:next})});applyTheme();toast(next?'Dark mode enabled.':'Light mode enabled.')}
async function showNotifications(){try{const n=await api('/api/notifications');openModal(`<div class="modal-head"><div><h2>Notifications</h2><p>Useful updates from your Park Sense account.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${n.items.map(x=>`<div class="parking-card"><div class="parking-head"><h3>${esc(x.title)}</h3><span class="pill">${esc(x.time)}</span></div><div class="meta">${esc(x.body)}</div></div>`).join('')}</div>`,true)}catch(e){toast(e.message)}}
function profile(){openModal(`<div class="modal-head"><div><h2>Account & profile</h2><p>Your Park Sense account</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Name</label><input value="${esc(state.user.name)}" disabled></div><div class="field"><label>Role</label><input value="${esc(state.user.role)}" disabled></div><div class="field full"><label>Email</label><input value="${esc(state.user.email)}" disabled></div></div><div class="notice">Account details are stored on the local backend for this prototype. Use “Switch account” to sign in as another user.</div></div>`,true)}
async function settings(){openModal(`<div class="modal-head"><div><h2>Settings</h2><p>Simple preferences that work across the site.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="parking-card"><div class="parking-head"><h3>Dark mode</h3><span>${state.data.settings.darkMode?'On':'Off'}</span></div><div class="meta">Change the appearance without changing the layout.</div><button class="btn" onclick="toggleDark();closeModal()">${state.data.settings.darkMode?'Use light mode':'Use dark mode'}</button></div><div class="parking-card"><div class="parking-head"><h3>Notifications</h3><span>${state.data.settings.notifications?'On':'Off'}</span></div><div class="meta">Show reservation and parking status updates.</div><button class="btn" onclick="toggleNotifications()">${state.data.settings.notifications?'Turn off':'Turn on'}</button></div></div>`,true)}
async function toggleNotifications(){const next=!state.data.settings.notifications;state.data.settings=await api('/api/settings',{method:'PUT',body:JSON.stringify({notifications:next})});closeModal();toast(next?'Notifications enabled.':'Notifications disabled.');settings()}
function toggleAccountMenu(){$('accountMenu')?.classList.toggle('open')}
async function switchAccount(){closeModal();await logout(true)}
async function logout(switchOnly=false){await api('/api/auth/logout',{method:'POST'});state.user=null;state.data=null;state.map=null;renderAuth()}
function go(v){state.screen=v;state.selected=null;render()}
window.addEventListener('resize',()=>state.map?.invalidateSize());
load();
</script>
</body></html>
